<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>气泡工坊 · DIY Codex Bubble</title><link rel="stylesheet" href="./workshop.css"><link rel="stylesheet" href="./codex-preview.css"><body><header><a href="./index.html" class="back">← 气泡库</a><strong>气泡工坊</strong><span class="sub">预览 · 调整 · 导出</span><button id="language">EN</button></header><main><section class="preview-card"><div class="section-title"><div><small>LIVE CODEX PREVIEW</small><h1>先看它在聊天里怎么长</h1></div><button id="theme">深色预览 ☾</button></div><div id="desktopPreview"></div></section><section class="editor-card"><div class="section-title"><div><small>BUBBLE WORKSHOP</small><h2 id="filename">选择一张 PNG</h2><p>拖动四条线选择平直的拉伸边，再拖动文字框调整位置。</p></div><label class="upload">选择 PNG<input id="file" type="file" accept="image/png" hidden></label></div><div class="editor-layout"><div class="art-wrap"><div id="art"><img id="image" draggable="false"><div id="stretchBand"></div><div id="textBox"><span>文!</span><i data-corner="nw"></i><i data-corner="ne"></i><i data-corner="sw"></i><i data-corner="se"></i></div><div class="guide vertical" data-key="left"></div><div class="guide vertical" data-key="right"></div><div class="guide horizontal" data-key="top"></div><div class="guide horizontal" data-key="bottom"></div></div></div><div class="controls"><label>文字颜色<input id="color" type="color" value="#44362f"></label><label>缩放 %<input id="scale" type="number" min="1" max="200" step="0.1"></label><label>圆角 px<input id="radius" type="number" min="0" max="200"></label><label>边框 px<input id="borderWidth" type="number" min="0" max="20" step="0.5"></label><label>边框颜色<input id="borderColor" type="color" value="#d0d0d0"></label><button id="fit">适合聊天</button><button id="reset">重置拉伸线和文字</button><div class="actions"><button id="download" class="primary">下载 PNG + 设置</button><button id="back">回到气泡库</button></div></div></div></section></main><div id="toast"></div><script type="module" src="./workshop.js"></script></body></html>
